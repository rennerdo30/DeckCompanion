name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the oldest supported; 3.13 matches current SteamOS.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q -p no:cacheprovider

  ui:
    name: UI tests (Godot 4.7.2, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
      - name: Import project
        run: timeout 300 ~/godot/godot --headless --path ui --import || true
      - name: Run UI checks
        run: timeout 600 ~/godot/godot --headless --path ui --script res://tests/run.gd -- --mock

  decky-plugin:
    name: Decky plugin build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: decky-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: decky-plugin/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in install.sh uninstall.sh DeckCompanion; do
            if head -1 "$f" | grep -q '^#!.*sh'; then sh -n "$f" && echo "ok $f"; fi
          done
      - name: Desktop installer entry is valid
        run: grep -q '^Exec=' DeckCompanion-Installer.desktop
