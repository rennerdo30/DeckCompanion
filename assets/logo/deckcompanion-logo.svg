  <text x="318" y="168" font-family="'Inter','Noto Sans','Segoe UI',system-ui,sans-serif" font-size="112" font-weight="800" letter-spacing="-2">
    <tspan fill="#f2f5f7">Deck</tspan><tspan fill="#b9e07a">Companion</tspan>
