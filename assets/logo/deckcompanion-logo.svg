    <circle r="31" fill="#0a1218" stroke="#b9e07a" stroke-width="9"/>
    <path d="M-14 1 L-4 11 L16 -10" fill="none" stroke="#e9d9a0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
