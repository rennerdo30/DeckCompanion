  <!-- companion spark -->
  <path d="M318 196 Q321 213 336 216 Q321 219 318 236 Q315 219 300 216 Q315 213 318 196 Z" fill="#e9d9a0"/>
  <path d="M432 120 Q434 132 444 134 Q434 136 432 148 Q430 136 420 134 Q430 132 432 120 Z" fill="#b9e07a" opacity="0.85"/>
