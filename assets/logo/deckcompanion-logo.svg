      <stop offset="1" stop-color="#b9e07a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256 256) scale(1.07) translate(-256 -269)">
  <!-- handheld body with grips -->
  <path d="M146 166 H366 C430 166 470 214 470 266 C470 330 440 372 404 372 C380 372 366 356 352 334 H160 C146 356 132 372 108 372 C72 372 42 330 42 266 C42 214 82 166 146 166 Z"
        fill="url(#body)" stroke="#b9e07a" stroke-width="10" stroke-linejoin="round"/>

