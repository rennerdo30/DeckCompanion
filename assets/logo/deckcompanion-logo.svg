  <g fill="#e9d9a0">
    <rect x="98" y="220" width="18" height="54" rx="5"/>
    <rect x="80" y="238" width="54" height="18" rx="5"/>
  </g>
  <!-- face buttons -->
  <g fill="#e9d9a0">
    <circle cx="414" cy="228" r="9"/>
    <circle cx="414" cy="266" r="9"/>
    <circle cx="395" cy="247" r="9"/>
    <circle cx="433" cy="247" r="9"/>
  </g>
  <!-- sticks -->
  <circle cx="134" cy="310" r="17" fill="#0b141b" stroke="#b9e07a" stroke-width="5"/>
  <circle cx="378" cy="310" r="17" fill="#0b141b" stroke="#b9e07a" stroke-width="5"/>

  <!-- screen -->
  <rect x="168" y="192" width="176" height="124" rx="18" fill="#0a1218" stroke="#2f6f68" stroke-width="4"/>
  <circle cx="256" cy="254" r="70" fill="url(#glow)"/>

  <!-- gear with check: "fixed and ready" -->
