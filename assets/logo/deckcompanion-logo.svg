<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 300" width="1240" height="300" role="img" aria-labelledby="t">
  <title id="t">DeckCompanion</title>
  <svg x="22" y="22" width="256" height="256" viewBox="0 0 512 512">
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132330"/>
